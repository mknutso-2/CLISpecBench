name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check
      - run: uv run pyright

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest src/swe_buildbench/tests -m "not docker" -v

  eval-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6

      - name: Install C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 cmake
        env:
          DEBIAN_FRONTEND: noninteractive

      - run: uv sync

      - name: Reference tests - WordCount
        run: uv run pytest Evals/WordCount/tests -v

      - name: Reference tests - CNCSim
        run: uv run pytest Evals/CNCSim/tests -v
