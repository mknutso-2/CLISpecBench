name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
      - run: bash scripts/ci-lint.sh

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
      - run: bash scripts/ci-unit.sh

  container-tests:
    # Docker-backed smoke tests: builds the base image and each agent image,
    # then runs environment / CLI-installation checks.  These do not prompt
    # the coding agents, so no API credentials are required.
    #
    # Gated on unit-tests because the Docker image builds are the most
    # expensive step in CI — no point paying for them if the pure-Python
    # test suite is already failing.
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
      - run: bash scripts/ci-container.sh

  eval-tests:
    name: eval-tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: BibTeX cpp
            target: bibtex-cpp
            needs_cpp: true
          - name: GEDCOM py
            target: gedcom-py
            needs_cpp: false
          - name: ICal cpp
            target: ical-cpp
            needs_cpp: true
          - name: IGES cpp
            target: iges-cpp
            needs_cpp: true
          - name: LAS py
            target: las-py
            needs_cpp: false
          - name: MARC21 official validation py
            target: marc21-official-validation-py
            needs_cpp: false
          - name: MARC21 official examples py
            target: marc21-official-examples-py
            needs_cpp: false
          - name: MARC21 core py
            target: marc21-core-py
            needs_cpp: false
          - name: WordCount cpp
            target: wordcount-cpp
            needs_cpp: true
          - name: RS274 cpp
            target: rs274-cpp
            needs_cpp: true
          - name: RS274 py
            target: rs274-py
            needs_cpp: false
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0

      - name: Install C++ toolchain
        if: ${{ matrix.needs_cpp }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 cmake
        env:
          DEBIAN_FRONTEND: noninteractive

      - run: bash scripts/ci-eval.sh ${{ matrix.target }}
