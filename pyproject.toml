[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project]
name = "swe-buildbench"
version = "0.1.0"
description = "Python test harnesses for SWE-BuildBench tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "docker>=7.0.0",
  "pytest-json-report>=1.5.0",
]

[project.scripts]
swe-buildbench = "swe_buildbench.cli:main"

[dependency-groups]
dev = [
  "pyright>=1.1.405",
  "pytest>=8.4.2",
  "ruff>=0.13.1",
]

[tool.uv.build-backend]
module-name = "swe_buildbench"
module-root = "src"

[tool.pyright] # keep an eye on ty from Astral. Could change to it in the future.
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "Evals/CNCSim/tests", "Evals/WordCount/tests", "src/swe_buildbench/tests"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["Evals/CNCSim/tests", "Evals/WordCount/tests"]
markers = [
  "docker: tests that require a running Docker daemon and built images",
  "prompts_agent: tests that send a real prompt to an AI coding agent (consumes API credentials / tokens)",
]

[tool.ruff]
line-length = 100 # 79 is Pep 8 official recommendation, 88 became popular because it was the default in Black, 100 is becoming popular in modern Python
src = ["src", "Evals/CNCSim/tests", "Evals/WordCount/tests", "src/swe_buildbench/tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.uv]
default-groups = ["dev"]
