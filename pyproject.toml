[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project]
name = "clispecbench"
version = "0.1.0"
description = "Python test harnesses for CLISpecBench tasks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "docker>=7.0.0",
  "pytest-json-report>=1.5.0",
]

[project.scripts]
clispecbench = "clispecbench.cli:main"

[dependency-groups]
dev = [
  "pyright>=1.1.405",
  "pytest>=8.4.2",
  "ruff>=0.13.1",
]

[tool.uv.build-backend]
module-name = "clispecbench"
module-root = "src"

[tool.pyright] # keep an eye on ty from Astral. Could change to it in the future.
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = [
  "src",
  "Evals/BibTeX/tests",
  "Evals/GEDCOM/tests",
  "Evals/ICal/tests",
  "Evals/IGES/tests",
  "Evals/LAS/tests",
  "Evals/MARC21/tests",
  "Evals/RS274/tests",
  "Evals/WordCount/tests",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = [
  "src/clispecbench/tests",
  "Evals/BibTeX/tests",
  "Evals/GEDCOM/tests",
  "Evals/ICal/tests",
  "Evals/IGES/tests",
  "Evals/LAS/tests",
  "Evals/MARC21/tests",
  "Evals/RS274/tests",
  "Evals/WordCount/tests",
]
markers = [
  "docker: tests that require a running Docker daemon and built images",
  "prompts_agent: tests that send a real prompt to an AI coding agent (consumes API credentials / tokens)",
]

[tool.ruff]
line-length = 100 # 79 is Pep 8 official recommendation, 88 became popular because it was the default in Black, 100 is becoming popular in modern Python
src = [
  "src",
  "Evals/BibTeX/tests",
  "Evals/GEDCOM/tests",
  "Evals/ICal/tests",
  "Evals/IGES/tests",
  "Evals/LAS/tests",
  "Evals/MARC21/tests",
  "Evals/RS274/tests",
  "Evals/WordCount/tests",
]
target-version = "py311"
# Reference implementations are graded by their hidden test suites, not by
# lint rules. They mirror what an agent would produce, so we don't want to
# hold them to harness style standards.
extend-exclude = ["**/reference-implementation-py/**"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.uv]
default-groups = ["dev"]
