<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>SWE-BuildBench Results Explorer</title>
    <link rel="stylesheet" href="results-dashboard.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div class="page-header-main">
          <h1>SWE-BuildBench Results Explorer</h1>
          <p>
            Machine-readable run data from
            <code class="source-tag">results-2_1_1_runs.csv</code>.
          </p>
        </div>
        <label for="csv-file-input" class="header-file-input"
               title="Load a different CSV (useful if this page is opened via file://)">
          <input id="csv-file-input" type="file" accept=".csv" />
          <span>Load local CSV…</span>
        </label>
      </header>

      <section class="card">
        <h2>Agent/model pairs</h2>
        <p class="hint">Select one or more pairs to plot.</p>
        <div class="selection-actions">
          <button id="pair-select-all" type="button" class="selection-action">Select all</button>
          <button id="pair-unselect-all" type="button" class="selection-action">Unselect all</button>
        </div>
        <div id="pair-list" class="checkbox-grid"></div>
      </section>

      <section class="card">
        <h2>Languages</h2>
        <p class="hint">
          Language must remain selected when plotting aggregate values.
        </p>
        <div id="language-list" class="checkbox-grid"></div>
      </section>

      <section class="card">
        <h2>Eval</h2>
        <select id="eval-select"></select>
      </section>

      <section class="card">
        <h2>Axes</h2>
        <div class="axis-row">
          <label for="x-axis">X axis</label>
          <select id="x-axis"></select>
        </div>
        <div class="axis-row">
          <label for="y-axis">Y axis</label>
          <select id="y-axis"></select>
        </div>
        <div class="axis-row">
          <label for="report-type">Report type</label>
          <select id="report-type"></select>
        </div>
        <div class="axis-row">
          <label for="error-bars">Error bars</label>
          <select id="error-bars"></select>
        </div>
        <p id="validation-message" class="hint"></p>
      </section>

      <section class="card">
        <h2>Color mode</h2>
        <div class="axis-row">
          <label for="color-mode">Color by</label>
          <select id="color-mode"></select>
        </div>
      </section>

      <section class="card">
        <h2>XY Scatter Plot</h2>
        <div id="chart-empty" class="chart-empty">No data to plot yet.</div>
        <div class="chart-wrap">
          <svg id="scatter-svg" viewBox="0 0 980 560" preserveAspectRatio="xMidYMid meet"></svg>
          <div id="tooltip" class="tooltip" aria-hidden="true"></div>
        </div>
        <div id="legend" class="legend"></div>
      </section>

      <p id="status" class="status"></p>
      <p id="error-banner" class="error-banner hidden"></p>
    </main>

    <script src="results-dashboard.js"></script>
  </body>
</html>
